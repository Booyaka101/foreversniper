name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wow-secret-lint
        run: |
          git clone https://github.com/Booyaka101/wow-secret-lint /tmp/lint
          cd /tmp/lint && npm install --no-save
          node bin/wow-secret-lint.mjs $GITHUB_WORKSPACE

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wow-addon-sim
        run: |
          git clone https://github.com/Booyaka101/wow-addon-sim /tmp/sim
          cd /tmp/sim && npm install --no-save
          node wow-addon-sim.mjs $GITHUB_WORKSPACE --strict
